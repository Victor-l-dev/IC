version: "3.1"

intents:
  - iniciar_anamnese
  - informar_dado
  - responder_escala
  - afirmar_ideacao
  - negar_ideacao

entities:
  - valor

slots:
  nome:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: identificacao_form
            requested_slot: nome

  idade:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: identificacao_form
            requested_slot: idade

  sexo:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: identificacao_form
            requested_slot: sexo

  indice_pergunta:
    type: float
    influence_conversation: false
    mappings:
      - type: custom

  score_ansiedade:
    type: float
    influence_conversation: false
    mappings:
      - type: custom

  score_depressao:
    type: float
    influence_conversation: false
    mappings:
      - type: custom

  respostas:
    type: list
    influence_conversation: false
    mappings:
      - type: custom

  tem_ideacao_suicida:
    type: bool
    influence_conversation: false
    mappings:
      - type: custom

  anamnese_encerrada:
    type: bool
    initial_value: false
    influence_conversation: false
    mappings:
      - type: custom

forms:
  identificacao_form:
    required_slots:
      - nome
      - idade
      - sexo

responses:
  utter_default:
    - text: "Desculpe, não entendi bem. Pode reformular ou tentar de novo?"

  utter_ask_nome:
    - text: "Olá. Vou fazer algumas perguntas para registrar seu histórico. Para começar, qual é o seu nome?"

  utter_ask_idade:
    - text: "Quantos anos você tem?"

  utter_ask_sexo:
    - text: "Como você se identifica?"
      buttons:
        - title: "Masculino"
          payload: "Masculino"
        - title: "Feminino"
          payload: "Feminino"
        - title: "Prefiro não dizer"
          payload: "Prefiro não dizer"

actions:
  - validate_identificacao_form
  - action_iniciar_questionario
  - action_registrar_resposta
  - action_protocolo_risco_suicida
  - action_encerrar_anamnese

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
