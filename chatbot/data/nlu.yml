version: "3.1"

nlu:

- intent: iniciar_anamnese
  examples: |
    - quero começar
    - pode começar
    - estou pronto
    - vamos lá
    - pode perguntar
    - sim, pode continuar
    - quero responder as perguntas

- intent: informar_nome
  examples: |
    - meu nome é [João](nome)
    - pode me chamar de [Ana](nome)
    - sou o [Carlos](nome)
    - me chamo [Maria](nome)

- intent: informar_idade
  examples: |
    - tenho [28](idade) anos
    - [35](idade) anos
    - tenho [42](idade)
    - sou jovem, tenho [19](idade) anos

- intent: informar_sexo
  examples: |
    - sou homem
    - sou mulher
    - masculino
    - feminino
    - prefiro não dizer

- intent: relatar_queixa_principal
  examples: |
    - estou com [ansiedade](queixa)
    - tenho sentido muita [tristeza](queixa)
    - acho que estou com [depressão](queixa)
    - estou sofrendo de [pânico](queixa)
    - meu problema principal é [insônia](queixa)
    - estou lidando com [estresse crônico](queixa)
    - sinto muita [angústia](queixa)
    - tenho [pensamentos obsessivos](queixa)
    - estou com [burnout](queixa)
    - sofro de [fobia social](queixa)
    - tenho [baixa autoestima](queixa)
    - estou com [crises de choro](queixa)
    - meu problema é [irritabilidade constante](queixa)
    - sofro com [isolamento](queixa)
    - tenho [dificuldade de concentração](queixa)
    - estou me sentindo [tristeza](queixa)
    - perdi o gosto de viver[depressao](queixa)

