version: "3.1"

# As respostas do questionário chegam por botões (payload), sem passar pelo NLU.
# O NLU só precisa separar o início da conversa dos dados de identificação.
nlu:
  - intent: iniciar_anamnese
    examples: |
      - quero começar
      - pode começar
      - estou pronto
      - vamos lá
      - pode perguntar
      - quero responder as perguntas
      - iniciar anamnese
      - começar

  - intent: informar_dado
    examples: |
      - João
      - Ana
      - Carlos Eduardo
      - Maria Silva
      - meu nome é João
      - pode me chamar de Ana
      - me chamo Maria
      - sou o Carlos
      - 28
      - 35 anos
      - tenho 42
      - tenho 19 anos
      - Masculino
      - Feminino
      - Prefiro não dizer
