version: "3.1"

rules:

- rule: iniciar anamnese - identificacao
  steps:
    - intent: iniciar_anamnese
    - action: identificacao_form
    - active_loop: identificacao_form

- rule: identificacao concluida - iniciar questionario
  condition:
    - active_loop: identificacao_form
  steps:
    - action: identificacao_form
    - active_loop: null
    - slot_was_set:
        - requested_slot: null
    - action: action_iniciar_questionario

- rule: resposta da escala - registrar e seguir
  steps:
    - intent: responder_escala
    - action: action_registrar_resposta

- rule: ideacao afirmada - alertar profissional e encerrar
  steps:
    - intent: afirmar_ideacao
    - action: action_protocolo_risco_suicida
    - action: action_encerrar_anamnese

- rule: ideacao negada - encerrar anamnese
  steps:
    - intent: negar_ideacao
    - action: action_encerrar_anamnese
